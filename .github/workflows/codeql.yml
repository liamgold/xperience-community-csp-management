name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ actions, csharp ]

    steps:
    - uses: actions/checkout@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        # The Dancing Goat example is unmodified Kentico sample code and isn't part of the published package
        config: |
          paths-ignore:
            - examples/**

    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: /language:${{ matrix.language }}
